<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5b4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>دفتر الحسابات</title>
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<style>
:root{--hd:#0f5b4d;--onp:#fff;--bg:#f3f5f4;--card:#fff;--ink:#14211f;--mut:#667470;--line:#dde4e1;--pri:#0f5b4d;--dr:#1d4e89;--cr:#b3382c;--gold:#b8892b}
@media(prefers-color-scheme:dark){:root:not([data-t=l]){--hd:#12332e;--onp:#06231d;--bg:#0e1514;--card:#16201e;--ink:#e6efec;--mut:#8fa09b;--line:#27342f;--pri:#3fb39c;--dr:#6aa3e0;--cr:#e57a6d;--gold:#d9ad55}}
:root[data-t=d]{--hd:#12332e;--onp:#06231d;--bg:#0e1514;--card:#16201e;--ink:#e6efec;--mut:#8fa09b;--line:#27342f;--pri:#3fb39c;--dr:#6aa3e0;--cr:#e57a6d;--gold:#d9ad55}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI",Tahoma,system-ui,sans-serif}
body{padding:0 0 calc(24px + env(safe-area-inset-bottom))}
#top{position:sticky;top:0;z-index:20;background:var(--hd);padding-top:env(safe-area-inset-top)}#dd{display:none;position:absolute;inset-inline:0;top:100%;background:var(--card);border-bottom:2px solid var(--pri);box-shadow:0 10px 20px #0004;max-height:70vh;overflow:auto}.di{display:block;width:100%;text-align:start;padding:13px 18px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer}.di.on{color:var(--pri);font-weight:700;background:var(--bg)}nav button.op{background:var(--bg)}
header .hr{display:flex;align-items:center;gap:6px}header button{background:none;border:0;color:#fff;padding:5px;border-radius:8px;cursor:pointer;display:inline-flex}header button.on{background:#ffffff33}header button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header small{opacity:.8}
main{max-width:900px;margin:auto;padding:14px}
nav{background:var(--card);border-bottom:1px solid var(--line);display:flex}
nav button{flex:1 1 0;min-width:0;line-height:1.25;border:0;background:none;color:var(--mut);padding:10px 2px;font:inherit;font-size:12px;cursor:pointer}
nav button.on{color:var(--pri);font-weight:700;box-shadow:inset 0 -3px var(--pri)}
nav span{display:block;height:21px}nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}#md{display:none;position:fixed;inset:0;z-index:50;background:#0008;align-items:flex-start;justify-content:center;padding:16px 12px;overflow:auto}#md .box{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:560px;margin:auto 0}
h2{font-size:18px;margin:6px 0 12px}h3{font-size:15px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.k small{color:var(--mut)}.k div{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.k.big{background:var(--pri);color:var(--onp);border:0}.k.big small{color:var(--onp);opacity:.8}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:start;color:var(--mut);font-weight:600;font-size:12.5px;border-bottom:2px solid var(--ink);padding:6px 4px}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.n{text-align:end;white-space:nowrap}
tr.tot td{border-top:1px solid var(--ink);border-bottom:3px double var(--ink);font-weight:700}
.dr{color:var(--dr)}.cr{color:var(--cr)}.mut{color:var(--mut)}
.wrap{overflow-x:auto}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.btn{border:0;background:var(--pri);color:var(--onp);border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;width:auto}
.btn.s{background:none;color:var(--pri);border:1px solid var(--pri)}
.btn.d{background:none;color:var(--cr);border:1px solid var(--cr);padding:3px 10px;font-size:13px}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mut)}
.ok{color:var(--pri);font-weight:700}.bad{color:var(--cr);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:24px}
.doc{padding:20px}.doc h1{font-size:20px}.doc .hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px double var(--ink);padding-bottom:10px;margin-bottom:10px}.sig{display:flex;justify-content:space-between;margin-top:40px;color:var(--mut)}.sig div{border-top:1px solid var(--mut);padding-top:4px;min-width:30%;text-align:center}.tt{width:270px;margin-inline-start:auto;margin-top:10px}nav button{font-size:10.5px;padding:7px 1px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.pb{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13.5px}.qr svg{width:150px;height:150px;display:block}.bt{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:12px}.bt .tt{margin:0}
.sgh td{background:var(--bg);font-weight:700}.th{background:#fff;color:#000;max-width:302px;margin:0 auto;padding:10px 8px;border:1px solid var(--line);text-align:center;font-size:12px;line-height:1.5}.th table{width:100%}.th th,.th td{text-align:center;padding:3px 1px;border-bottom:1px dashed #999;color:#000}.th th{border-bottom:1px solid #000;font-size:11px}.th .tn td{border:0}.th .dash{border-top:1px dashed #000;margin:6px 0}.th .qr{display:flex;justify-content:center;margin-top:8px}
@media print{:root{--bg:#fff!important;--card:#fff!important;--ink:#000!important;--mut:#555!important;--line:#ccc!important;--pri:#0f5b4d!important;--dr:#1d4e89!important;--cr:#b3382c!important}.th{border:0;max-width:none;padding:0}.doc{padding:0}#top,.bar,.btn{display:none!important}body{background:#fff;padding:0}.card,.k{border:0}}
</style>
</head>
<body>
<div id="top"><header><b id="co"></b><div class="hr"><small id="dt"></small><button id="hs" onclick="go('more')" aria-label="الإعدادات"></button></div></header><nav id="nav"></nav><div id="dd"></div></div>
<main id="main"></main>
<div id="md" onclick="if(event.target===this)closeMd()"></div>
<script>
// ---------- PWA: manifest + icons embedded as data URIs ----------
(function(){
  function ic(n){var c=document.createElement('canvas');c.width=c.height=n;var x=c.getContext('2d');
    x.fillStyle='#0f5b4d';x.beginPath();x.roundRect?x.roundRect(0,0,n,n,n*.2):x.rect(0,0,n,n);x.fill();
    x.strokeStyle='#e8c46a';x.lineWidth=n*.03;x.strokeRect(n*.2,n*.2,n*.6,n*.6);
    x.fillStyle='#fff';x.font='bold '+n*.42+'px Tahoma,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('ح',n/2,n*.53);
    x.fillStyle='#e8c46a';x.fillRect(n*.28,n*.74,n*.44,n*.025);x.fillRect(n*.28,n*.78,n*.44,n*.025);
    return c.toDataURL('image/png')}
  try{var i1=ic(192),i2=ic(512);
    document.getElementById('ai').href=i1;
    var m={name:'دفتر الحسابات',short_name:'الحسابات',lang:'ar',dir:'rtl',display:'standalone',start_url:'.',background_color:'#f3f5f4',theme_color:'#0f5b4d',icons:[{src:i1,sizes:'192x192',type:'image/png'},{src:i2,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    document.getElementById('mf').href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m));
  }catch(e){}
})();

// ---------- Data ----------
const KEY='acc_v1',TY={asset:'أصول',liab:'خصوم',eq:'حقوق ملكية',rev:'إيرادات',exp:'مصروفات'};
const seed=()=>({co:'شركتي',vat:15,seq:1,iseq:1,
 acc:[['1010','الصندوق','asset'],['1020','البنك','asset'],['1100','العملاء','asset'],['1200','المخزون','asset'],['1300','ضريبة مدخلات','asset'],
 ['2010','الموردون','liab'],['2100','ضريبة مخرجات','liab'],['3010','رأس المال','eq'],['4010','المبيعات','rev'],['5010','تكلفة المبيعات','exp'],
 ['5100','الرواتب','exp'],['5200','الإيجار','exp'],['5300','مصروفات عامة','exp']].map(a=>({c:a[0],n:a[1],t:a[2]})),je:[],inv:[]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
S.items=S.items||[];S.is=S.is||1;S.vn=S.vn||'';S.ad=S.ad||'';S.pt=S.pt||[];S.ps=S.ps||1;['cr','bn','st','dt','ct','pc'].forEach(k=>S[k]=S[k]||'');migrate();
function migrate(){
 S.sg=S.sg||[[1,'asset','نقدية وبنوك'],[2,'asset','ذمم مدينة'],[3,'asset','مخزون'],[4,'asset','أصول متداولة أخرى'],[5,'asset','أصول ثابتة'],[6,'liab','ذمم دائنة'],[7,'liab','ضرائب مستحقة'],[8,'liab','التزامات أخرى'],[9,'eq','رأس المال والاحتياطيات'],[10,'rev','إيرادات المبيعات'],[11,'rev','إيرادات أخرى'],[12,'exp','تكلفة المبيعات'],[13,'exp','مصروفات تشغيلية']].map(x=>({id:x[0],t:x[1],n:x[2]}));
 S.sgs=S.sgs||14;const M={'1010':1,'1020':1,'1100':2,'1200':3,'1300':4,'2010':6,'2100':7,'3010':9,'4010':10,'5010':12,'5100':13,'5200':13,'5300':13};
 S.acc.forEach(a=>{if(!a.s)a.s=M[a.c]||(S.sg.find(g=>g.t===a.t)||{}).id});
 S.th=S.th||'auto';S.pms=S.pms||'ex';S.pmp=S.pmp||'ex';S.ic=S.ic||[{id:1,n:'عام'}];S.ics=S.ics||2;S.items.forEach(x=>{if(!x.g)x.g=S.ic[0].id})}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('تعذر الحفظ في المتصفح — خُذ نسخة احتياطية')}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=v=>(+v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const A=c=>S.acc.find(a=>a.c===c),an=c=>A(c)?c+' - '+A(c).n:c;
const cmp=(a,b)=>String(a).localeCompare(String(b),'en',{numeric:true}),qf=v=>(+v||0).toLocaleString('en-US',{maximumFractionDigits:3});
const r2=v=>Math.round((+v||0)*100)/100;
function tb(to,from){const m={};S.acc.forEach(a=>m[a.c]={dr:0,cr:0});
 S.je.forEach(e=>{if((to&&e.d>to)||(from&&e.d<from))return;e.l.forEach(l=>{if(m[l.a]){m[l.a].dr+=+l.dr||0;m[l.a].cr+=+l.cr||0}})});return m}
const bal=(a,x)=>{const n=x.dr-x.cr;return (a.t==='asset'||a.t==='exp')?n:-n};
let V='home',ST={dd:-1},IH=IH0(),il=[{i:'',q:1,p:''}],jl=[{a:'',dr:'',cr:''},{a:'',dr:'',cr:''}];

// ---------- Views ----------
const ic=p=>`<svg viewBox="0 0 24 24">${p}</svg>`,I={home:ic('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'),vch:ic('<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h6M9 16h6"/>'),acc:ic('<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/>'),inv:ic('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),rep:ic('<path d="M4 4v16h16"/><path d="M8 16v-5M12 16V8M16 16v-8"/>'),pt:ic('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.4c2 .8 3.5 2.6 3.5 5.6"/>'),set:ic('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>')};
const MENU=[['الرئيسية',I.home,'home'],
 ['سندات',I.vch,[['سند قيد','vch','vt','jv'],['سند افتتاحي','vch','vt','op'],['سند دفع','vch','vt','pay'],['سند قبض','vch','vt','rec'],['سند يومية','vch','vt','dy']]],
 ['حسابات',I.acc,[['دليل الحسابات','coa'],['دفتر اليومية','jb'],['دفتر الأستاذ','led'],['أرصدة الحسابات','abl']]],
 ['فواتير',I.inv,[['فاتورة مشتريات','inv','it','buy'],['فاتورة مبيعات','inv','it','sale'],['مرتجع مشتريات','inv','it','rbuy'],['مرتجع مبيعات','inv','it','rsale'],['بداية المدة','ob'],['دليل المواد','items'],['حركة مادة','mvt'],['جرد المواد','cnt'],['أرباح المواد','ipf']]],
 ['التقارير',I.rep,[['ميزان المراجعة','rep','rt','tb'],['المتاجرة','rep','rt','tr'],['الأرباح والخسائر','rep','rt','is'],['الميزانية','rep','rt','bs'],['إقرار الضريبة','rep','rt','vat']]],
 ['الموردين والعملاء',I.pt,'pt']];
const DEF={vt:'jv',it:'sale',rt:'tb'},cur=it=>it[1]===V&&(!it[2]||(ST[it[2]]||DEF[it[2]])===it[3]);
function drawNav(){const act=MENU.findIndex(m=>typeof m[2]==='string'?V===m[2]:(m[2].some(cur)||(V==='pr'&&m[0]==='فواتير')));
 $('#nav').innerHTML=MENU.map((m,i)=>`<button class="${i===act?'on':''} ${ST.dd===i?'op':''}" onclick="mn(${i},event)"><span>${m[1]}</span>${m[0]}${typeof m[2]!=='string'?' ▾':''}</button>`).join('');
 const g=ST.dd>=0?MENU[ST.dd]:null;$('#dd').innerHTML=g?g[2].map((it,k)=>`<button class="di ${cur(it)?'on':''}" onclick="pk(${ST.dd},${k})">${it[0]}</button>`).join(''):'';$('#dd').style.display=g?'block':'none';return act}
function mn(i,ev){if(ev)ev.stopPropagation();const m=MENU[i];if(typeof m[2]==='string'){ST.dd=-1;go(m[2])}else{ST.dd=ST.dd===i?-1:i;drawNav()}}
function pk(gi,k){const it=MENU[gi][2][k];ST.dd=-1;if(it[2])ST[it[2]]=it[3];if(it[1]==='inv'){ST.eiv=0;IH=IH0();il=[{i:'',q:1,p:''}]}if(it[1]==='vch'){ST.ev=0;jl=[{a:'',dr:'',cr:''},{a:'',dr:'',cr:''}]}if(it[1]==='coa'){ST.ec=null;ST.ca=null}go(it[1])}
function openInv(t){ST.it=t;ST.eiv=0;IH=IH0();il=[{i:'',q:1,p:''}];go('inv')}
function go(v){V=v;ST.dd=-1;render()}
function render(){drawNav();$('#co').textContent=S.co||'دفتر الحسابات';$('#dt').textContent=new Date().toLocaleDateString('ar-EG',{dateStyle:'medium'});$('#hs').innerHTML=I.set;$('#hs').className=V==='more'?'on':'';$('#main').innerHTML=VW[V]();scrollTo(0,0)}
const opts=(ty,sel)=>{const o=a=>`<option value="${a.c}" ${a.c===sel?'selected':''}>${esc(a.c+' - '+a.n)}</option>`,L=S.acc.filter(a=>!ty||ty.includes(a.t));let h='';
 Object.keys(TY).forEach(t=>S.sg.filter(g=>g.t===t).forEach(g=>{const l=L.filter(a=>a.s===g.id);if(l.length)h+=`<optgroup label="${TY[t]} ‹ ${esc(g.n)}">${l.map(o).join('')}</optgroup>`}));
 return h+L.filter(a=>!S.sg.some(g=>g.id===a.s)).map(o).join('')};
function itemOpts(sel){const o=x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.code+' - '+x.name)}</option>`;
 return S.ic.map(c=>{const l=S.items.filter(x=>x.g===c.id);return l.length?`<optgroup label="${esc(c.n)}">${l.map(o).join('')}</optgroup>`:''}).join('')+S.items.filter(x=>!S.ic.some(c=>c.id===x.g)).map(o).join('')}

const VW={
home(){const m=tb(),g=c=>A(c)?bal(A(c),m[c]):0,sum=t=>S.acc.filter(a=>a.t===t).reduce((s,a)=>s+bal(a,m[a.c]),0);
 const rev=sum('rev'),ex=sum('exp'),cash=g('1010')+g('1020');
 const last=[...S.je].sort((a,b)=>b.d.localeCompare(a.d)||cmp(b.id,a.id)).slice(0,6);
 return `<div class="grid"><div class="k big"><small>صافي الربح</small><div>${f(rev-ex)}</div></div>
 <div class="k"><small>النقدية والبنك</small><div>${f(cash)}</div></div>
 <div class="k"><small>الإيرادات</small><div>${f(rev)}</div></div>
 <div class="k"><small>المصروفات</small><div>${f(ex)}</div></div>
 <div class="k"><small>مستحق من العملاء</small><div>${f(g('1100'))}</div></div>
 <div class="k"><small>مستحق للموردين</small><div>${f(g('2010'))}</div></div>
 <div class="k"><small>ضريبة مستحقة للهيئة</small><div>${f(g('2100')-g('1300'))}</div></div></div>
 <div class="bar"><button class="btn" onclick="openInv('sale')">+ فاتورة مبيعات</button><button class="btn s" onclick="openInv('buy')">+ مشتريات / مصروف</button></div>
 <h3>آخر القيود</h3><div class="card wrap">${jtable(last)}</div>`},

inv(){const t=ST.it||'sale',sl_=isS(t),h=IH,its=S.items,P=getP(h.pid);
 const lr=il.map((l,k)=>`<tr><td style="min-width:150px"><select onchange="il[${k}].i=+this.value;pick(${k})"><option value="">اختر صنف</option>${itemOpts(l.i)}</select></td><td style="width:80px"><input type="number" step="any" inputmode="decimal" value="${l.q}" oninput="il[${k}].q=this.value;ptot()"></td><td style="width:100px"><input type="number" step="0.01" inputmode="decimal" value="${l.p}" oninput="il[${k}].p=this.value;ptot()"></td><td class="n" id="lt${k}">${f(l.q*l.p)}</td><td>${il.length>1?`<button class="btn d" onclick="il.splice(${k},1);render()">×</button>`:''}</td></tr>`).join('');
 const list=[...S.inv].filter(i=>i.t===t).sort((a,b)=>b.id-a.id);

 let d='';for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(best[y][x])d+=`M${x+4} ${y+4}h1v1h-1z`;const Z=N+8;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Z} ${Z}" shape-rendering="crispEdges"><rect width="${Z}" height="${Z}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
